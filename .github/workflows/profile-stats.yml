name: Update profile stats

on:
  schedule:
    - cron: "43 8 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-language-stats
  cancel-in-progress: false

jobs:
  update-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Check stats token
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          if [ -z "$PROFILE_STATS_TOKEN" ]; then
            echo "::error::Create the PROFILE_STATS_TOKEN repository secret before running this workflow."
            exit 1
          fi

      - name: Generate language card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=dev-leonunes&layout=compact&langs_count=8&hide_border=true&card_width=340&bg_color=0f172a&title_color=f59e0b&text_color=f8fafc
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: "true"

      - name: Generate stats card
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        with:
          USERNAME: dev-leonunes
          THEME: radical
          AUTO_PUSH: false

      - name: Apply portfolio palette to stats card
        run: |
          python3 - <<'PY'
          from pathlib import Path

          svg = Path("profile-summary-card-output/radical/3-stats.svg").read_text()
          palette = {
              "#141321": "#0f172a",
              "#fe428e": "#f59e0b",
              "#f8d847": "#f59e0b",
              "#a9fef7": "#f8fafc",
          }
          for original, replacement in palette.items():
              svg = svg.replace(original, replacement)
          Path("profile/stats.svg").write_text(svg)
          PY

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=dev-leonunes&mode=weekly&hide_border=true&card_width=400&card_height=235&disable_animations=true&background=0f172a&stroke=334155&ring=f59e0b&fire=f59e0b&currStreakNum=f8fafc&sideNums=f8fafc&currStreakLabel=f59e0b&sideLabels=f59e0b&dates=94a3b8
          path: profile/streak.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/top-langs.svg profile/stats.svg profile/streak.svg
          if git diff --cached --quiet; then
            echo "Profile cards have not changed."
            exit 0
          fi
          git commit -m "chore: update profile stats"
          git push
